name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - run: python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enable Pages once in Settings > Pages > Source: GitHub Actions.
      # GITHUB_TOKEN cannot create the Pages site, even with pages: write.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Explain Pages setup failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### GitHub Pages configuration failed

          The documentation build succeeded, but Pages could not be configured.
          Check the error in **Configure GitHub Pages** above. If Pages is not
          enabled, open [Settings → Pages](https://github.com/julianascencio/energyclimates/settings/pages)
          and select **GitHub Actions** under **Build and deployment → Source**.
          Then rerun the failed deployment job. The standard `GITHUB_TOKEN`
          can deploy an existing Pages site, but cannot enable it for the first time.
          EOF
      - uses: actions/deploy-pages@v4
        id: deployment
