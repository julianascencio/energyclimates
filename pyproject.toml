[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "energyclimates"
version = "0.1.0"
description = "Climate classification, machine learning and mapping for energy systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "DATA_LICENSES.md"]
authors = [{name = "Julian Ascencio and EnergyClimates contributors"}]
keywords = ["climate", "solar", "photovoltaics", "energy", "bess", "kgpv", "classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "xarray>=2024.6", "netCDF4>=1.7",
  "scipy>=1.12", "rasterio>=1.3", "requests>=2.32", "pillow>=10",
  "cdsapi>=0.7", "scikit-learn>=1.4", "dask[array]>=2024.6",
  "pyarrow>=16", "zarr>=2.18"
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/julianascencio/energyclimates"
Documentation = "https://github.com/julianascencio/energyclimates/tree/main/docs"
Issues = "https://github.com/julianascencio/energyclimates/issues"

[project.scripts]
energyclimates = "energyclimates.cli:main"
pvclimate = "kgpv.engine.cli:main"
kgpv = "kgpv.cli:main"

[tool.setuptools.packages.find]
include = ["energyclimates*", "kgpv*"]

[tool.setuptools.package-data]
"kgpv.engine" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
