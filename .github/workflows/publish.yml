name: Publish Python package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os, energyclimates; assert os.environ['RELEASE_TAG'] == 'v' + energyclimates.__version__"
      - run: python -m pytest
      - run: node tests/test_map_math.cjs
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/energyclimates/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
